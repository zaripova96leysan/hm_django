{% extends 'base.html' %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
    <h1>Удалить статью</h1>
    <p>Вы уверены, что хотите удалить "{{ post.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
        <a href="{% url 'blog_detail' post.pk %}">Отмена</a>
    </form>
{% endblock %}
