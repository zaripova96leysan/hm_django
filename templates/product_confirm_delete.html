{% extends 'base.html' %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
    <h1>Удалить товар</h1>
    <p>Вы уверены, что хотите удалить "{{ product.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
        <a href="{% url 'product_detail' product.pk %}">Отмена</a>
    </form>
{% endblock %}
