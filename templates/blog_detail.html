{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <h1>{{ post.title }}</h1>

    {% if post.image %}
        <img src="{{ post.image.url }}" width="400">
    {% endif %}

    <p>{{ post.content }}</p>
    <p>Дата: {{ post.created_at }}</p>
    <p>Просмотров: {{ post.views }}</p>

    <a href="{% url 'blog_edit' post.pk %}">Редактировать</a>
    <a href="{% url 'blog_delete' post.pk %}">Удалить</a>
    <p><a href="{% url 'blog_list' %}">← Назад к списку</a></p>
{% endblock %}
